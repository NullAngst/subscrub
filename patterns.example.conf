# Subscrub user patterns.
# Copy this to ~/.config/subscrub/patterns.conf and it gets loaded every run.
#
# One rule per line:
#   drop REGEX       delete the cue if its whole text matches
#   cut REGEX        remove the match from anywhere in the cue
#   drop-case REGEX  same as drop, but case-sensitive
#   cut-case REGEX   same as cut, but case-sensitive
#
# Regexes are Python syntax. Matching is case-insensitive unless you use
# the -case forms. Lines starting with # are ignored.
#
# Examples:

# A line your Whisper model keeps inventing over silence:
# drop that's all for today\.?

# A channel name it keeps dropping into real lines:
# cut \bsome channel name\b,?

# A name that only counts when capitalised:
# cut-case \bProduced by [A-Z]\w+\b
